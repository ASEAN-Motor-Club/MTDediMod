name: Nix Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'server/v*'
  pull_request:
    branches:
      - master
    paths:
      - 'SERVER_VERSION'
      - 'Scripts/**'
      - 'shared/**'
      - 'src/**'
      - 'tools/**'
      - 'patches-ue4ss/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/check_version.py'
      - '.github/workflows/nix-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # Job 1: Build Lua native dependencies (Windows - cached)
  # ============================================================
  build-lua-deps:
    # PRs from forks have no UEPSEUDO_PAT, so they cannot build the private UE4SS submodules.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    steps:
      - name: Cache Lua dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: shared.zip
          key: lua-deps-socket-cjson-v1-${{ hashFiles('.github/workflows/nix-release.yml') }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: x64

      - name: Build Lua 5.4
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L -o lua.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          tar -xzf lua.tar.gz
          cd lua-5.4.8\src
          cl /c /O2 /MT /DLUA_COMPAT_5_3 *.c
          lib /out:lua54.lib lapi.obj lcode.obj lctype.obj ldebug.obj ldo.obj ldump.obj lfunc.obj lgc.obj llex.obj lmem.obj lobject.obj lopcodes.obj lparser.obj lstate.obj lstring.obj ltable.obj ltm.obj lundump.obj lvm.obj lzio.obj lauxlib.obj lbaselib.obj lcorolib.obj ldblib.obj liolib.obj lmathlib.obj loslib.obj lstrlib.obj ltablib.obj lutf8lib.obj loadlib.obj linit.obj
          cl /O2 /MT lua.c lua54.lib /Fe:lua.exe
          mkdir %GITHUB_WORKSPACE%\lua\bin
          mkdir %GITHUB_WORKSPACE%\lua\include
          mkdir %GITHUB_WORKSPACE%\lua\lib
          copy lua.exe %GITHUB_WORKSPACE%\lua\bin\
          copy lua.h %GITHUB_WORKSPACE%\lua\include\
          copy luaconf.h %GITHUB_WORKSPACE%\lua\include\
          copy lualib.h %GITHUB_WORKSPACE%\lua\include\
          copy lauxlib.h %GITHUB_WORKSPACE%\lua\include\
          copy lua54.lib %GITHUB_WORKSPACE%\lua\lib\

      - name: Setup Lua PATH
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          "${{ github.workspace }}\lua\bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append
          "LUA=${{ github.workspace }}\lua\bin\lua.exe" | Out-File -FilePath "$env:GITHUB_ENV" -Append
          "LUA_INCDIR=${{ github.workspace }}\lua\include" | Out-File -FilePath "$env:GITHUB_ENV" -Append
          "LUA_LIBDIR=${{ github.workspace }}\lua\lib" | Out-File -FilePath "$env:GITHUB_ENV" -Append

      - uses: luarocks/gh-actions-luarocks@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          withLuaPath: ${{ github.workspace }}\lua

      - name: Install LuaSocket and Cjson
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          luarocks install --local luasocket CFLAGS="/MT"
          luarocks install --local lua-cjson CFLAGS="/MT"
          
          New-Item -ItemType Directory shared
          Copy-Item -Recurse -Force $env:APPDATA\luarocks\*\lua\5.4\* .\shared\
          Compress-Archive -Path .\shared .\shared.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lua-deps
          path: shared.zip
          retention-days: 30

  # ============================================================
  # Job 2: Build mod with Nix (Linux)
  # ============================================================
  build-mod:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      USE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: false
          persist-credentials: false

      - name: Validate version and determine release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_version.py
          FILE_VER="$(tr -d '\r\n' < SERVER_VERSION)"

          SHOULD_RELEASE="false"
          TAG=""
          RELEASE_VER="${FILE_VER}-dev-$(git rev-parse --short HEAD)"
          PRERELEASE="false"

          if [[ "${{ github.ref }}" == refs/tags/server/v* ]]; then
            TAG="${{ github.ref_name }}"
            python3 scripts/check_version.py --tag "$TAG"
            RELEASE_VER="${TAG#server/v}"
            if [[ "$RELEASE_VER" == *-rc* || "$RELEASE_VER" == *-exp.* ]]; then
              PRERELEASE="true"
            else
              git fetch --no-tags origin master
              if ! git merge-base --is-ancestor HEAD origin/master; then
                echo "::error::Stable tag $TAG must point to a commit on master (use -exp.<name>.<N> or -rc.<N> for branch previews)"
                exit 1
              fi
            fi
            SHOULD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              PREVIOUS="$(git show HEAD^:SERVER_VERSION 2>/dev/null | tr -d '\r\n' || true)"
            else
              PREVIOUS="$(git show "${BEFORE}:SERVER_VERSION" 2>/dev/null | tr -d '\r\n' || true)"
            fi
            if [[ "$FILE_VER" != "$PREVIOUS" ]]; then
              CANDIDATE="server/v${FILE_VER}"
              python3 scripts/check_version.py --tag "$CANDIDATE"
              if git ls-remote --tags origin "refs/tags/$CANDIDATE" | grep -q .; then
                echo "Tag $CANDIDATE already exists — skipping automatic release"
              else
                SHOULD_RELEASE="true"
                TAG="$CANDIDATE"
                RELEASE_VER="$FILE_VER"
              fi
            fi
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release decision: should_release=$SHOULD_RELEASE tag=$TAG version=$RELEASE_VER prerelease=$PRERELEASE"

      - name: Get UE4SS locked revision
        id: ue4ss-rev
        run: echo "rev=$(jq -r '.nodes.ue4ss.locked.rev' flake.lock)" >> $GITHUB_OUTPUT

      - name: Fetch UE4SS source with submodules
        uses: actions/checkout@v4
        with:
          repository: UE4SS-RE/RE-UE4SS
          ref: ${{ steps.ue4ss-rev.outputs.rev }}
          path: .ue4ss-src
          submodules: recursive
          token: ${{ secrets.UEPSEUDO_PAT }}

      - name: Normalize UE4SS source for Nix
        shell: bash
        run: |
          # actions/checkout writes the token into .git/config and adds reflog
          # entries. A Nix path: input copies that metadata into the store, so
          # ue4ss-patched gets a new narHash every run and can never be
          # substituted from cache. Nix git inputs contain no .git at all,
          # so removing it restores the source shape Nix expects.
          find .ue4ss-src -name .git -prune -exec rm -rf {} +

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.UEPSEUDO_PAT }}

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable sccache (GitHub Actions Cache v2)
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache xwin
        uses: actions/cache@v4
        with:
          path: .xwin-cache
          key: xwin-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: xwin-${{ runner.os }}-

      - name: Configure
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#configure

      - name: Build
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ -n "$BIN" ] && [ -x "$BIN" ]; then
            "$BIN" --show-stats
          else
            echo "sccache unavailable - no stats"
          fi

      - name: Report sccache hit rate
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ ! -x "$BIN" ]; then
            echo "sccache unavailable - no cache-health data" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATS="$("$BIN" --show-stats)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$STATS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          HITS="$(echo "$STATS" | awk '$1 == "Cache" && $2 == "hits" && $3 ~ /^[0-9]+$/ { print $3; exit }')"
          MISSES="$(echo "$STATS" | awk '$1 == "Cache" && $2 == "misses" && $3 ~ /^[0-9]+$/ { print $3; exit }')"
          if [ -n "$HITS" ] && [ -n "$MISSES" ]; then
            RATE="$(awk -v h="$HITS" -v m="$MISSES" 'BEGIN { t = h + m; printf "%.1f", (t > 0 ? 100 * h / t : 0) }')"
            echo "sccache hit rate: ${RATE}% (${HITS} hits / ${MISSES} misses)" >> "$GITHUB_STEP_SUMMARY"
            if awk -v r="$RATE" 'BEGIN { exit !(r < 80) }'; then
              echo "::warning::sccache hit rate ${RATE}% is below 80% - this run is cache-cold or its cache scope changed"
            fi
          else
            echo "sccache stats did not contain hit/miss counters" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#package

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: MotorTownMods-package.zip
          retention-days: 30

  # ============================================================
  # Job 3: Merge and release (tag push or version bump on master)
  # ============================================================
  create-release:
    needs: [build-lua-deps, build-mod]
    if: needs.build-mod.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: false

      - name: Merge packages
        run: |
          VERSION="${{ needs.build-mod.outputs.version }}"
          
          # Extract mod package
          unzip mod-package/MotorTownMods-package.zip -d release
          
          # Extract Lua deps into the Mods shared folder
          unzip lua-deps/shared.zip -d lua-deps-extracted
          mkdir -p release/ue4ss/Mods/shared
          cp -r lua-deps-extracted/shared/* release/ue4ss/Mods/shared/
          
          # Create final zip
          cd release
          zip -r "../MotorTownMods_v${VERSION}.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MotorTownMods v${{ needs.build-mod.outputs.version }}
          tag_name: ${{ needs.build-mod.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Installation

            1. Stop the Motor Town dedicated server.
            2. Extract `MotorTownMods_v${{ needs.build-mod.outputs.version }}.zip` into `<ServerRoot>\MotorTown\Binaries\Win64\` so `version.dll` and the `ue4ss\` folder sit next to `MotorTownServer-Win64-Shipping.exe` (overwrite existing files when updating).
            3. Start the dedicated server.

            *(UE4SS and Lua native dependencies `luasocket`/`cjson` are bundled. On AMC NixOS hosts, bump `mod-versions.nix` instead of extracting manually.)*

            ---
          files: MotorTownMods_v*.zip
          generate_release_notes: true
          prerelease: ${{ needs.build-mod.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build-mod.outputs.prerelease != 'true' }}
