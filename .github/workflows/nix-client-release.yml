name: Nix Client Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'client/v*'
  pull_request:
    branches:
      - master
    paths:
      - 'VERSION'
      - 'ClientScripts/**'
      - 'shared/**'
      - 'client-signatures/**'
      - 'overlay/**'
      - 'tools/**'
      - 'patches-ue4ss/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/check_version.py'
      - '.github/workflows/nix-client-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-client-mod:
    # PRs from forks have no UEPSEUDO_PAT, so they cannot build the private UE4SS submodules.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      USE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: false
          persist-credentials: false

      - name: Validate version and determine release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_version.py
          FILE_VER="$(tr -d '\r\n' < VERSION)"

          SHOULD_RELEASE="false"
          TAG=""
          RELEASE_VER="${FILE_VER}-dev-$(git rev-parse --short HEAD)"
          PRERELEASE="false"

          if [[ "${{ github.ref }}" == refs/tags/client/v* ]]; then
            TAG="${{ github.ref_name }}"
            python3 scripts/check_version.py --tag "$TAG"
            RELEASE_VER="${TAG#client/v}"
            if [[ "$RELEASE_VER" == *-rc* || "$RELEASE_VER" == *-exp.* ]]; then
              PRERELEASE="true"
            else
              git fetch --no-tags origin master
              if ! git merge-base --is-ancestor HEAD origin/master; then
                echo "::error::Stable tag $TAG must point to a commit on master (use -exp.<name>.<N> or -rc.<N> for branch previews)"
                exit 1
              fi
            fi
            SHOULD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              PREVIOUS="$(git show HEAD^:VERSION 2>/dev/null | tr -d '\r\n' || true)"
            else
              PREVIOUS="$(git show "${BEFORE}:VERSION" 2>/dev/null | tr -d '\r\n' || true)"
            fi
            if [[ "$FILE_VER" != "$PREVIOUS" ]]; then
              CANDIDATE="client/v${FILE_VER}"
              python3 scripts/check_version.py --tag "$CANDIDATE"
              if git ls-remote --tags origin "refs/tags/$CANDIDATE" | grep -q .; then
                echo "Tag $CANDIDATE already exists — skipping automatic release"
              else
                SHOULD_RELEASE="true"
                TAG="$CANDIDATE"
                RELEASE_VER="$FILE_VER"
              fi
            fi
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release decision: should_release=$SHOULD_RELEASE tag=$TAG version=$RELEASE_VER prerelease=$PRERELEASE"

      - name: Get UE4SS locked revision
        id: ue4ss-rev
        run: echo "rev=$(jq -r '.nodes.ue4ss.locked.rev' flake.lock)" >> $GITHUB_OUTPUT

      - name: Fetch UE4SS source with submodules
        uses: actions/checkout@v4
        with:
          repository: UE4SS-RE/RE-UE4SS
          ref: ${{ steps.ue4ss-rev.outputs.rev }}
          path: .ue4ss-src
          submodules: recursive
          token: ${{ secrets.UEPSEUDO_PAT }}

      - name: Normalize UE4SS source for Nix
        shell: bash
        run: |
          # actions/checkout writes the token into .git/config and adds reflog
          # entries. A Nix path: input copies that metadata into the store, so
          # ue4ss-patched gets a new narHash every run and can never be
          # substituted from cache. Nix git inputs contain no .git at all,
          # so removing it restores the source shape Nix expects.
          find .ue4ss-src -name .git -prune -exec rm -rf {} +

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.UEPSEUDO_PAT }}

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable sccache (GitHub Actions Cache v2)
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache xwin
        uses: actions/cache@v4
        with:
          path: .xwin-cache
          key: xwin-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: xwin-${{ runner.os }}-

      - name: Configure client
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#configure-client

      - name: Build client
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build-client

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ -n "$BIN" ] && [ -x "$BIN" ]; then
            "$BIN" --show-stats
          else
            echo "sccache unavailable - no stats"
          fi

      - name: Build egui overlay (admin and player)
        run: |
          nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build-overlay -- admin
          nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build-overlay -- player

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ -n "$BIN" ] && [ -x "$BIN" ]; then
            "$BIN" --show-stats
          else
            echo "sccache unavailable - no stats"
          fi

      - name: Report sccache hit rate
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ ! -x "$BIN" ]; then
            echo "sccache unavailable - no cache-health data" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATS="$("$BIN" --show-stats)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$STATS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          HITS="$(echo "$STATS" | awk '$1 == "Cache" && $2 == "hits" && $3 ~ /^[0-9]+$/ { print $3; exit }')"
          MISSES="$(echo "$STATS" | awk '$1 == "Cache" && $2 == "misses" && $3 ~ /^[0-9]+$/ { print $3; exit }')"
          if [ -n "$HITS" ] && [ -n "$MISSES" ]; then
            RATE="$(awk -v h="$HITS" -v m="$MISSES" 'BEGIN { t = h + m; printf "%.1f", (t > 0 ? 100 * h / t : 0) }')"
            echo "sccache hit rate: ${RATE}% (${HITS} hits / ${MISSES} misses)" >> "$GITHUB_STEP_SUMMARY"
            if awk -v r="$RATE" 'BEGIN { exit !(r < 80) }'; then
              echo "::warning::sccache hit rate ${RATE}% is below 80% - this run is cache-cold or its cache scope changed"
            fi
          else
            echo "sccache stats did not contain hit/miss counters" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package both client variants
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#package-client-all

      - name: Rename prerelease artifacts to include tag suffix
        if: steps.release.outputs.prerelease == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          RELEASE_VER="${{ steps.release.outputs.version }}"
          if [[ "$FILE_VER" != "$RELEASE_VER" ]]; then
            for variant in admin player; do
              mv "MotorTownClientMod-${FILE_VER}-${variant}.zip" "MotorTownClientMod-${RELEASE_VER}-${variant}.zip"
            done
          fi

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-mod-packages
          path: MotorTownClientMod-*-*.zip
          retention-days: 30

  create-release:
    needs: build-client-mod
    if: needs.build-client-mod.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-mod-packages

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MotorTownClientMod v${{ needs.build-client-mod.outputs.version }}
          tag_name: ${{ needs.build-client-mod.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            MotorTownClientMod-*-admin.zip
            MotorTownClientMod-*-player.zip
          generate_release_notes: true
          prerelease: ${{ needs.build-client-mod.outputs.prerelease == 'true' }}
          make_latest: false
