name: Nix Client Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'client/v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-client-mod:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      USE_SCCACHE: "1"
      RUSTC_WRAPPER: sccache
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: false
          persist-credentials: false

      - name: Get UE4SS locked revision
        id: ue4ss-rev
        run: echo "rev=$(jq -r '.nodes.ue4ss.locked.rev' flake.lock)" >> $GITHUB_OUTPUT

      - name: Fetch UE4SS source with submodules
        uses: actions/checkout@v4
        with:
          repository: UE4SS-RE/RE-UE4SS
          ref: ${{ steps.ue4ss-rev.outputs.rev }}
          path: .ue4ss-src
          submodules: recursive
          token: ${{ secrets.UEPSEUDO_PAT }}

      - name: Normalize UE4SS source for Nix
        shell: bash
        run: |
          # actions/checkout writes the token into .git/config and adds reflog
          # entries. A Nix path: input copies that metadata into the store, so
          # ue4ss-patched gets a new narHash every run and can never be
          # substituted from cache. Nix git inputs contain no .git at all,
          # so removing it restores the source shape Nix expects.
          find .ue4ss-src -name .git -prune -exec rm -rf {} +

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.UEPSEUDO_PAT }}

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable sccache (GitHub Actions Cache v2)
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Cache xwin
        uses: actions/cache@v4
        with:
          path: .xwin-cache
          key: xwin-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: xwin-${{ runner.os }}-

      - name: Configure client
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#configure-client

      - name: Build client
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build-client

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ -n "$BIN" ] && [ -x "$BIN" ]; then
            "$BIN" --show-stats
          else
            echo "sccache unavailable - no stats"
          fi

      - name: Build egui overlay (admin and player)
        run: |
          nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build-overlay -- admin
          nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#build-overlay -- player

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ -n "$BIN" ] && [ -x "$BIN" ]; then
            "$BIN" --show-stats
          else
            echo "sccache unavailable - no stats"
          fi

      - name: Report sccache hit rate
        if: always()
        shell: bash
        run: |
          BIN="${SCCACHE_BIN:-${SCCACHE_PATH:-}}"
          if [ -z "$BIN" ]; then BIN="$(command -v sccache 2>/dev/null || true)"; fi
          if [ ! -x "$BIN" ]; then
            echo "sccache unavailable - no cache-health data" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATS="$("$BIN" --show-stats)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$STATS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          HITS="$(echo "$STATS" | awk '$1 == "Cache" && $2 == "hits" && $3 ~ /^[0-9]+$/ { print $3; exit }')"
          MISSES="$(echo "$STATS" | awk '$1 == "Cache" && $2 == "misses" && $3 ~ /^[0-9]+$/ { print $3; exit }')"
          if [ -n "$HITS" ] && [ -n "$MISSES" ]; then
            RATE="$(awk -v h="$HITS" -v m="$MISSES" 'BEGIN { t = h + m; printf "%.1f", (t > 0 ? 100 * h / t : 0) }')"
            echo "sccache hit rate: ${RATE}% (${HITS} hits / ${MISSES} misses)" >> "$GITHUB_STEP_SUMMARY"
            if awk -v r="$RATE" 'BEGIN { exit !(r < 80) }'; then
              echo "::warning::sccache hit rate ${RATE}% is below 80% - this run is cache-cold or its cache scope changed"
            fi
          else
            echo "sccache stats did not contain hit/miss counters" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package both client variants
        run: nix run --no-update-lock-file --override-input ue4ss "path:$PWD/.ue4ss-src" .#package-client-all

      - name: Extract version from VERSION
        id: version
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ -z "$VERSION" ]]; then echo "VERSION file is empty"; exit 1; fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            if [[ "${{ github.ref_name }}" != "client/v$VERSION" ]]; then
              echo "Tag ${{ github.ref_name }} does not match VERSION $VERSION"; exit 1
            fi
          else
            VERSION="$VERSION-dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-mod-packages
          path: MotorTownClientMod-*-*.zip
          retention-days: 30

  create-release:
    needs: build-client-mod
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-mod-packages

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: MotorTownClientMod v${{ needs.build-client-mod.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            MotorTownClientMod-*-admin.zip
            MotorTownClientMod-*-player.zip
          generate_release_notes: true
          make_latest: false
