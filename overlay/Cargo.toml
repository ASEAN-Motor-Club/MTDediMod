[package]
name = "mt_overlay"
version = "0.1.0"
edition = "2021"
description = "egui overlay for MotorTownClientMod, drawn from a DXGI Present hook"
publish = false

[features]
# The player build turns this off: no admin window, no admin bridge commands,
# no aim-impulse state. It is a compile-time guard, not a runtime toggle.
default = ["admin"]
admin = []

[lib]
# Loaded into the game by the Lua mod with package.loadlib(path, "*"), which
# only maps the DLL: no Lua C API is needed, DllMain starts everything.
crate-type = ["cdylib"]

[dependencies]
egui = "0.29"
retour = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Teleport list fetch (rustls, no OpenSSL to ship)
ureq = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# examples/harness.rs registers its own window class (WNDCLASSW needs Gdi)
windows = { version = "0.58", features = ["Win32_Graphics_Gdi"] }

[profile.release]
# A panic must never unwind across the Present/WndProc FFI boundary into the
# game; every hook catches its own panics, abort is the backstop.
panic = "abort"
lto = true
opt-level = 3
